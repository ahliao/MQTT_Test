syntax = "proto3";

package sensorplatform;

message AdcReading {
  string sensor_id = 1;
  int64 timestamp_ms = 2;
  uint32 channel = 3;
  uint32 raw_value = 4;
  double voltage = 5;
}

message ProcessedReading {
  string sensor_id = 1;
  int64 timestamp_ms = 2;
  uint32 channel = 3;
  double voltage = 4;
  double moving_average_voltage = 5;
  string state = 6;
}

message ServiceStatus {
  string service_name = 1;
  int64 timestamp_ms = 2;
  string status = 3;
  string message = 4;
}
